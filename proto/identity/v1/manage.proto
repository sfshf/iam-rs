syntax = "proto3";
package identity.v1;

import "google/api/annotations.proto";

service ManageService {
  // GetUserSessions 获取用户会话列表
  rpc GetUserSessions(GetUserSessionsRequest) returns (GetUserSessionsResponse) {
    option (google.api.http) = {get: "/api/v1/identity/manage/user/session"};
  }
  // DeleteUserSession 删除用户会话
  rpc DeleteUserSession(DeleteUserSessionRequest) returns (DeleteUserSessionResponse) {
    option (google.api.http) = {delete: "/api/v1/identity/manage/user/session"};
  }
}

message GetUserSessionsRequest {}

message GetUserSessionsResponse {
  repeated UserSession sessions = 1; // 用户会话列表
}

message UserSession {
  string session_id = 1; // 会话ID
  string user_id = 2; // 用户ID
  int64 created_at = 3; // 创建时间
  int64 expires_at = 4; // 过期时间
}

message DeleteUserSessionRequest {
  string session_id = 1; // 会话ID
}

message DeleteUserSessionResponse {}
