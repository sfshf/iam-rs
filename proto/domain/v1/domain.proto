syntax = "proto3";
package domain.v1;

import "google/api/annotations.proto";

service DomainService {
  // Ping 服务探活
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {get: "/v1/domain/ping"};
  }
  // Resources
}

message PingRequest {
  int64 ts = 1;
}

message PingResponse {
  int64 ts = 1;
}
